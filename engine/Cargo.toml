[package]
name = "gitindex"
version = "0.1.0"
edition = "2021"
description = "Turn a git repository into a fresh, complete, queryable SQL database (Parquet) — commits, diffs, renames, blame, ancestry — verified against git."
license = "Apache-2.0"
repository = "https://github.com/eos-xyz/gitindex"
keywords = ["git", "index", "parquet", "blame", "sql"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"

[dependencies]
anyhow = "1.0"
arrow = "59"
parquet = "59"
clap = { version = "4", features = ["derive"] }
gix = { version = "0.87", features = ["blame"] }
git2 = "0.21.0"
rayon = "1.12.0"
# L3 symbols (Stage: symbols slice) — tree-sitter definition extraction per blob.
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-ruby = "0.23"
tree-sitter-c = "0.23"
streaming-iterator = "0.1"
# Content-defined chunking dedup (): 128-bit content hash per chunk.
twox-hash = { version = "2", default-features = false, features = ["xxhash3_128", "std"] }
# Manifest parsing for the dependencies layer (): package.json (JSON),
# Cargo.toml / pyproject.toml (TOML).
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
